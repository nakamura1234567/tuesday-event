<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑑定フローガイド</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .copied { background-color: #eef2ff !important; color: #4f46e5 !important; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">

    <header class="bg-gradient-to-r from-indigo-900 to-purple-800 text-white p-6 shadow-md">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold mb-1">鑑定フローガイド</h1>
                <p class="text-xs text-indigo-200 opacity-90">Counselor Operation Manual</p>
            </div>
            <button onclick="toggleHelp()" class="p-2 bg-white/10 rounded-full hover:bg-white/20 transition-colors">
                <i data-lucide="help-circle" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="px-4 py-6 max-w-md mx-auto" id="app-content">
        <div class="mb-8">
            <h2 class="text-sm font-bold text-slate-500 mb-3 ml-1 flex justify-between items-center">
                鑑定フロー
                <span class="text-[10px] font-normal text-slate-400">横にスワイプできます →</span>
            </h2>
            <div class="flex overflow-x-auto pb-4 gap-2 snap-x hide-scrollbar" id="flow-steps">
                </div>
        </div>

        <div class="space-y-6" id="flow-details">
            </div>
    </main>

    <div id="help-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800">ツールの使い方</h3>
                    <button onclick="toggleHelp()" class="text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <div class="space-y-4 text-sm text-slate-600">
                    <p>・コピーボタンで例文を保存し、鑑定画面に貼り付けて使用します。</p>
                    <p>・GOOD/BADの指針を確認し、質の高い鑑定を目指しましょう。</p>
                </div>
                <button onclick="toggleHelp()" class="w-full mt-6 py-3 bg-indigo-600 text-white rounded-xl font-bold">了解しました</button>
            </div>
        </div>
    </div>

    <script>
        const flowData = [
            {
                id: 1,
                icon: "search",
                iconColor: "text-indigo-500",
                title: "初回ヒアリング",
                point: "お客様の基本情報 (性格・感情タイプ・恋愛観)を把握することで、鑑定内容をパーソナライズできる。一度にまとめて聞くことでお客様の負担を減らし、離脱を防ぐ。",
                good: "お客様の状況や悩みを整理しやすいように、具体的な質問を投げかける",
                bad: "何度も質問をして負担をかけてしまう",
                examples: [
                    {
                        title: "基本ヒアリング（意図：まとめて聞く）",
                        text: "ご相談ありがとうございます！\n復縁をご希望されているお気持ち、しっかりと受け止めさせていただきました。\nその恋愛が今後良い形で成熟していくように、まずは貴方様ご自身の性格や恋愛傾向について、ご一緒に読み解いていきましょう！\n\n以下の情報をお答えいただいた後、今の貴方様の状況について鑑定結果をお送りしますね！\n① 基本的な性格傾向\n周囲からは、どのような性格だと言われる？\n（例：優しい／真面目／感情的／冷静 など）\n② 感情・対人関係について\n嬉しい/不安なことは、誰かにすぐ話すタイプ？\nそれとも、心の中に溜め込みやすいですか？\n③ 恋愛における価値観\n恋愛では、どちらを重視することが多いですか？\nA：安心感・安定　B：ときめき・刺激"
                    }
                ]
            },
            {
                id: 2,
                icon: "eye",
                iconColor: "text-pink-500",
                title: "初回鑑定",
                point: "お客様の性格・恋愛傾向を先に伝えることで信頼感を生む。全てを一度に話さず、次の鑑定への橋渡しになる内容にとどめる。",
                good: "鑑定説明を順番に行う（現状 → 相手の気持ち → 今後の展開 → 行動指針）",
                bad: "全ての内容を1度きりの長文で説明しつくす",
                examples: [
                    {
                        title: "性格診断と共感の導入",
                        text: "あなた様は〇な性格の持ち主です。\nそのため、恋愛傾向では△のパターンに当てはまります。\n\n△のタイプのあなた様は実際に今の恋愛において当てはまる点はありませんでしたか？\n例えば、\n連絡を送りすぎて返信が少ない。\nもしくは既読無視でも追い連絡など"
                    }
                ]
            },
            {
                id: 3,
                icon: "message-circle",
                iconColor: "text-teal-500",
                title: "鑑定後ヒアリング",
                point: "初回鑑定後、結果に対してお客様の反応や現状を確認することで、次の鑑定への自然な流れを作る。",
                good: "鑑定後〜次回鑑定までの間に、結果に対してのヒアリングをしている",
                bad: "鑑定後に鑑定師自ら終わる言葉を発してヒアリングをしていない",
                examples: [
                    {
                        title: "お相手の心の領域への深掘り",
                        text: "ここから先は、\n✔ お相手様が今、貴方様のことをどう想っているのか\n✔ 今後このご縁がどのように動いていくのか\nといった 「お相手様側の心の領域」 を詳しく読み解く段階になります。\nまずは、お相手様との関係性についてお伺いさせてください。\n一番知りたいこと　\n以下の中で、特に気になるものを教えてください。\n\nA：今も私に気持ちは残っていますか？\nB：復縁の可能性はありますか？\nC：今後、関係が動くタイミングはありますか？\nD：この恋を続けるべきか、手放すべきか"
                    }
                ]
            },
            {
                id: 4,
                icon: "calendar-clock",
                iconColor: "text-orange-500",
                title: "締めの言葉",
                point: "当日の鑑定を振り返りつつ、次回鑑定のタイミングを示すことでリピートへの期待感を持たせる。",
                good: "当日の振り返りと次回視る時期を伝えること",
                bad: "当日の感謝のみで振り返りも次回予約時期も言わないこと",
                examples: [
                    {
                        title: "次回への期待感（変化の示唆）",
                        text: "今回の鑑定ではお相手の今のお気持ちを中心に視させていただきましたが、恋愛の流れは(連絡の有無・時間経過・お二人の距離感)によって変化することも多いです。また少し時間が経った時や状況が動いたタイミングで視させていただくとより具体的な流れも出やすくなるんです！気になることがあればいつでもご相談くださいね✨"
                    }
                ]
            },
            {
                id: 5,
                icon: "heart-handshake",
                iconColor: "text-rose-500",
                title: "アフターフォロー",
                point: "鑑定後翌日以降に送信。営業感を出さず、お客様との関係性を温め続けることで自然な再訪問につなげる。",
                good: "お名前をつけて、営業感を抑えながら現状をさりげなく聞く",
                bad: "締めの言葉と無関係な内容や営業感のある内容を送る",
                examples: [
                    {
                        title: "翌日以降のフォロー例文",
                        text: "○○様こんにちは。先日はご相談ありがとうございました。\nその後、お気持ちや状況に変化はありますか？\n小さな変化でも、その意味を視ていくと新しい流れが見えることもあります。\nもし何か気になることがあれば、またお話聞かせてくださいね。"
                    }
                ]
            }
        ];

        const steps = ['アポメ返信', '初回ヒアリング', '初回鑑定', '鑑定後ヒアリング', '2回目鑑定', '締めの言葉', 'アフターフォロー'];
        const activeSteps = [1, 2, 3, 5, 6];

        document.addEventListener('DOMContentLoaded', () => {
            const flowStepsContainer = document.getElementById('flow-steps');
            steps.forEach((step, idx) => {
                const isActive = activeSteps.includes(idx);
                const colorClass = isActive ? 'bg-indigo-100 text-indigo-700 font-bold shadow-sm' : 'bg-slate-200 text-slate-500 opacity-60';
                let html = `<div class="flex-shrink-0 flex items-center snap-center"><div class="px-3 py-2 rounded-xl text-[11px] whitespace-nowrap transition-all ${colorClass}">${step}</div>`;
                if (idx < 6) html += `<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 mx-1"></i>`;
                html += `</div>`;
                flowStepsContainer.insertAdjacentHTML('beforeend', html);
            });

            const flowDetailsContainer = document.getElementById('flow-details');
            flowData.forEach(step => {
                let examplesHtml = step.examples.map(ex => `
                    <div class="relative group border border-slate-200 rounded-xl bg-white overflow-hidden transition-all">
                        <div class="bg-slate-100/50 px-3 py-2 border-b border-slate-200 flex justify-between items-center">
                            <span class="text-[11px] font-bold text-slate-500 uppercase">${ex.title}</span>
                            <button onclick="copyText(this, \`${ex.text.replace(/`/g, '\\`')}\`)" class="copy-btn flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-indigo-50 text-indigo-600 transition-all active:scale-95">
                                <i data-lucide="copy" class="w-3.5 h-3.5 icon-copy"></i>
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5 icon-check hidden"></i>
                                <span class="text-[11px] font-bold btn-text tracking-tighter">コピー</span>
                            </button>
                        </div>
                        <div class="p-4 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${ex.text}</div>
                    </div>
                `).join('');

                const sectionHtml = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="flex items-center gap-3 p-5 border-b border-slate-50 bg-slate-50/30">
                            <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100">
                                <i data-lucide="${step.icon}" class="w-6 h-6 ${step.iconColor}"></i>
                            </div>
                            <h2 class="text-lg font-bold text-slate-800">
                                <span class="text-[10px] text-white bg-indigo-500 px-1.5 py-0.5 rounded-md mr-2 align-middle">STEP ${step.id}</span>
                                ${step.title}
                            </h2>
                        </div>
                        <div class="p-5 space-y-6">
                            <div class="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100/50">
                                <div class="text-[10px] font-black text-indigo-400 mb-1 tracking-widest uppercase italic">Key Point</div>
                                <p class="text-sm text-slate-600 leading-relaxed font-medium">${step.point}</p>
                            </div>
                            <div class="grid grid-cols-1 gap-4">
                                <div class="flex gap-4 bg-emerald-50/40 p-4 rounded-xl border border-emerald-100/50">
                                    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0"><i data-lucide="check" class="w-5 h-5 text-emerald-600"></i></div>
                                    <div><div class="text-[10px] font-bold text-emerald-700 mb-1 uppercase tracking-wider">GOOD</div><p class="text-xs text-slate-600 leading-relaxed">${step.good}</p></div>
                                </div>
                                <div class="flex gap-4 bg-rose-50/40 p-4 rounded-xl border border-rose-100/50">
                                    <div class="w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center flex-shrink-0"><i data-lucide="x" class="w-5 h-5 text-rose-600"></i></div>
                                    <div><div class="text-[10px] font-bold text-rose-700 mb-1 uppercase tracking-wider">BAD</div><p class="text-xs text-slate-600 leading-relaxed">${step.bad}</p></div>
                                </div>
                            </div>
                            <div class="pt-2">
                                <div class="text-xs font-black text-slate-400 mb-4 flex items-center gap-2 uppercase tracking-[0.2em]">Templates</div>
                                <div class="space-y-4">${examplesHtml}</div>
                            </div>
                        </div>
                    </div>
                `;
                flowDetailsContainer.insertAdjacentHTML('beforeend', sectionHtml);
            });
            lucide.createIcons();
        });

        function copyText(btnElement, text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const iconCopy = btnElement.querySelector('.icon-copy');
                const iconCheck = btnElement.querySelector('.icon-check');
                const btnText = btnElement.querySelector('.btn-text');
                btnElement.classList.add('copied');
                iconCopy.classList.add('hidden');
                iconCheck.classList.remove('hidden');
                btnText.textContent = "コピー完了";
                setTimeout(() => {
                    btnElement.classList.remove('copied');
                    iconCopy.classList.remove('hidden');
                    iconCheck.classList.add('hidden');
                    btnText.textContent = "コピー";
                }, 2000);
            } catch (err) { console.error('Copy failed', err); }
            document.body.removeChild(textArea);
        }

        function toggleHelp() {
            document.getElementById('help-modal').classList.toggle('hidden');
        }
    </script>
</body>
</html>
