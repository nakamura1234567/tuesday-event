<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑑定フローガイド</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* コピー完了時のアニメーション用 */
        .copied {
            background-color: #eef2ff !important;
            color: #4f46e5 !important;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-indigo-900 to-purple-800 text-white p-6 rounded-b-3xl shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold mb-1">鑑定フローガイド</h1>
        <p class="text-xs text-indigo-200 opacity-90">Counselor Operation Manual</p>
    </header>

    <main class="px-4 py-6 max-w-md mx-auto" id="app-content">
        <!-- フローの全体図 -->
        <div class="mb-8">
            <h2 class="text-sm font-bold text-slate-500 mb-3 ml-1">鑑定フロー</h2>
            <div class="flex overflow-x-auto pb-4 gap-2 snap-x hide-scrollbar" id="flow-steps">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- 各ステップの詳細 -->
        <div class="space-y-6" id="flow-details">
            <!-- JSで生成 -->
        </div>
    </main>

    <script>
        const flowData = [
            {
                id: 1,
                icon: "search",
                iconColor: "text-indigo-500",
                title: "初回ヒアリング",
                point: "お客様の基本情報や現状を把握することで、鑑定内容をパーソナライズできる。一度にまとめて聞くことでお客様の負担を減らし、離脱を防ぐ。",
                good: "お客様の状況や悩みを整理しやすいように、具体的な質問を投げかける",
                bad: "質問が抽象的すぎたり、一度に多すぎる質問をして負担をかける",
                examples: [
                    {
                        title: "関係性のヒアリング（汎用）",
                        text: "今の貴方様の恋愛を読み解くために、まずはお相手様との関係について教えていただけますか？\n\n①現在の関係性: 最後に連絡を取った時期 / 今も連絡は取れていますか？\n②ご相談内容: 今一番悩んでいること、どうなりたいかをお聞かせください。"
                    }
                ]
            },
            {
                id: 2,
                icon: "eye",
                iconColor: "text-pink-500",
                title: "初回鑑定",
                point: "お客様の性格・恋愛傾向を先に伝えることで信頼感を生む。全てを一度に話さず、次の鑑定への橋渡しになる内容にとどめる。",
                good: "鑑定説明を順番に行う\n(現状 → 相手の気持ち → 今後の展開 → 行動指針)",
                bad: "全ての内容を1度きりの長文で説明しつくす",
                examples: [
                    {
                        title: "基本エネルギーについて",
                        text: "貴方様は、周囲の期待に応えようとする真面目で誠実なエネルギーを強く持っています。一方で、感情や不安を内に溜め込む傾向があるため、恋愛でストレスを感じた際に自分一人で抱え込んでしまうのが特徴です。その真面目さこそが魅力ですが、復縁という道のりでは、この「溜め込みやすさ」が相手への不必要な遠慮や不安に繋がってしまう可能性があります。"
                    },
                    {
                        title: "「安心感・安定」重視タイプ",
                        text: "恋愛で「安心感・安定」を重視する貴方様は、穏やかで地に足のついた関係を望みます。しかし、復縁を目指す上では、この「安定志向」が過去の失敗を繰り返すことへの強い恐れとなり、なかなか一歩を踏み出せない原因になることがあります。復縁の鍵は「安定」へのこだわりを手放し、まずは「貴方様自身の心の安定」を取り戻すため、相手に依存せず、貴方様がご自身の魅力と行動力に自信を持てたとき、この恋愛は初めて良い方向へと動き出します。"
                    },
                    {
                        title: "「特別感」重視タイプ",
                        text: "恋愛において貴方様は、心が動く瞬間や、特別感を感じられる関係性を大切にするタイプです。復縁に対しても、「もう一度ワクワクできるか」「同じ気持ちになれるか」を無意識に判断している状態だと出ています。刺激を求める一方で、気持ちが冷めると距離を取りやすい傾向があるため、恋愛の温度差が生まれやすい点が特徴です。復縁における鍵は、一時的な高揚感だけで動かず、感情が落ち着いたときのご自身の本音を見極めることにあります。ときめきを大切にしながらも、「この人とどんな関係を築きたいのか」を整理できたとき、貴方様の想いは相手に伝わりやすくなりこの恋愛は前向きな流れへと進み始めます。"
                    }
                ]
            },
            {
                id: 3,
                icon: "message-circle",
                iconColor: "text-teal-500",
                title: "鑑定後ヒアリング",
                point: "初回鑑定後、結果に対してお客様の反応や現状を確認することで、次の鑑定への自然な流れを作る。",
                good: "鑑定後〜次回鑑定までの間に、結果に対してのヒアリングをしている",
                bad: "鑑定後に鑑定師自ら終わる言葉を発してヒアリングをしていない",
                examples: [
                    {
                        title: "相手の気持ちを読み解く前の確認",
                        text: "あなた様の恋愛タイプを知れましたので、ここから先は、\n✓ お相手様が今、貴方様のことをどう想っているのか\n✓ 今後このご縁がどのように動いていくのか\nといった「お相手様側の心の中身」を詳しく読み解く段階になります。\nまずは、お相手様との関係性についてお伺いさせてください。\n①現在の関係性：最後に連絡を取った時期 / 今も連絡は取れていますか？"
                    },
                    {
                        title: "特徴からの現状確認（少し追う恋）",
                        text: "△のタイプのあなた様の特徴として例えばですが、\n・ご自身から連絡を送ることが多い\n・お相手様からの返信が少なく感じる\n・既読後、少しお時間が空いても追い連絡をしてしまう\nなど、「少し追う恋」になっているご状況などはございませんでしょうか？"
                    }
                ]
            },
            {
                id: 4,
                icon: "calendar-clock",
                iconColor: "text-orange-500",
                title: "締めの言葉",
                point: "当日の鑑定を振り返りつつ、次回鑑定のタイミングを示すことでリピートへの期待感を持たせる。",
                good: "当日の振り返りと次回視る時期を伝えること",
                bad: "当日の感謝のみで振り返りも次回予約時期も言わないこと",
                examples: [
                    {
                        title: "時間の経過による変化を示唆",
                        text: "今回の鑑定ではお相手の今のお気持ちを中心に視させていただきましたが、恋愛の流れは(連絡の有無・時間経過・お二人の距離感)によって変化することも多いです。また少し時間が経った時や状況が動いたタイミングで視させていただくとより具体的な流れも出やすくなるんです！気になることがあればいつでもご相談くださいね✨"
                    },
                    {
                        title: "次回視る内容を具体的に提示",
                        text: "今日はご相談くださりありがとうございました✨ お話をお伺いして、お相手の気持ちや今の状況は○○の可能性が高いと感じました。ただ今回の鑑定では「今のお気持ち」の部分を中心に視させていただいたので、もしよろしければ次回は(今後の流れ・連絡のタイミング・関係が動く時期)なども詳しく視ていくことができます🔮また気になることが出てきた時や、状況が少し動いた時にはいつでもご相談くださいね🌙応援しております✨"
                    },
                    {
                        title: "寄り添いと具体的な時期の提示",
                        text: "今日お話を伺っていて○○様がとても頑張っていらっしゃるのが伝わりました。焦らず少しずつで大丈夫です✨ 今回視させていただいた流れだと○○頃に少し動きが出る可能性も感じました。もし途中で「これってどうなんだろう？」と思うことがあったら小さなことでも大丈夫なのでいつでも頼ってくださいね🔮その頃にもう一度視させていただくとより具体的な流れも見えやすくなると思います🔮もしよろしければまたその頃にお話聞かせてくださいね✨"
                    }
                ]
            },
            {
                id: 5,
                icon: "heart-handshake",
                iconColor: "text-rose-500",
                title: "アフターフォロー",
                point: "営業感を出さず、お客様との関係性を温め続けることで自然な再訪問・再鑑定につなげる。",
                good: "お名前をつけて、営業感を抑えながら現状をさりげなく聞く",
                bad: "締めの言葉と無関係な内容や「鑑定しませんか？」等の営業感のある内容を送る",
                examples: [
                    {
                        title: "一緒に視ていきたい姿勢を伝える",
                        text: "○○様こんにちは✨ 先日ご相談いただいた○○です🔮\nその後、お気持ちや状況に変化はありましたか？\n恋愛の流れは少し時間が経つと見え方が変わることもあるので、もし気になることが出てきた時には、また一緒に視ていけたらと思っています🌙"
                    },
                    {
                        title: "小さな変化への気づきを促す",
                        text: "○○様こんにちは✨\n先日はご相談ありがとうございました🔮 その後、お相手との状況はいかがでしょうか？小さな変化でも、その意味を視ていくと新しい流れが見えることもあります。もし何か気になることがあれば、またお話聞かせてくださいね🌙"
                    },
                    {
                        title: "近況報告を促す",
                        text: "○○様こんにちは✨\n先日はご相談ありがとうございました🔮 あの後、何か状況に変化はありましたか？\nもしお相手の反応や気になる出来事があれば、その意味も含めてまた視ることができますので、よかったら近況を聞かせてくださいね🌙"
                    }
                ]
            }
        ];

        const steps = ['アポメ返信', '初回ヒアリング', '初回鑑定', '鑑定後ヒアリング', '2回目鑑定', '締めの言葉', 'アフターフォロー'];
        const activeSteps = [1, 2, 3, 5, 6];

        // UIレンダリング
        document.addEventListener('DOMContentLoaded', () => {
            // ステップナビゲーションの描画
            const flowStepsContainer = document.getElementById('flow-steps');
            steps.forEach((step, idx) => {
                const isActive = activeSteps.includes(idx);
                const colorClass = isActive ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-500';
                
                let html = `
                    <div class="flex-shrink-0 flex items-center snap-center">
                        <div class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${colorClass}">
                            ${step}
                        </div>
                `;
                if (idx < 6) {
                    html += `<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 mx-1"></i>`;
                }
                html += `</div>`;
                flowStepsContainer.insertAdjacentHTML('beforeend', html);
            });

            // 詳細コンテンツの描画
            const flowDetailsContainer = document.getElementById('flow-details');
            flowData.forEach(step => {
                let examplesHtml = step.examples.map((ex, idx) => `
                    <div class="relative group border border-slate-200 rounded-xl bg-white overflow-hidden transition-all focus-within:ring-2 focus-within:ring-indigo-500">
                        <div class="bg-slate-100/50 px-3 py-2 border-b border-slate-200 flex justify-between items-center">
                            <span class="text-xs font-semibold text-slate-600">${ex.title}</span>
                            <button 
                                onclick="copyText(this, \`${ex.text.replace(/`/g, '\\`')}\`)"
                                class="copy-btn flex items-center gap-1.5 px-2.5 py-1 bg-white border border-slate-200 rounded-md shadow-sm hover:bg-indigo-50 text-indigo-600 transition-colors active:scale-95"
                            >
                                <i data-lucide="copy" class="w-3.5 h-3.5 icon-copy"></i>
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5 icon-check hidden"></i>
                                <span class="text-[10px] font-bold btn-text">コピー</span>
                            </button>
                        </div>
                        <div class="p-3 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${ex.text}</div>
                    </div>
                `).join('');

                const sectionHtml = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="flex items-center gap-3 p-4 border-b border-slate-100 bg-slate-50/50">
                            <div class="bg-white p-2 rounded-xl shadow-sm">
                                <i data-lucide="${step.icon}" class="w-6 h-6 ${step.iconColor}"></i>
                            </div>
                            <h2 class="text-lg font-bold text-slate-800">
                                <span class="text-sm text-indigo-500 font-semibold mr-2">${step.id}</span>
                                ${step.title}
                            </h2>
                        </div>
                        <div class="p-4 space-y-5">
                            <div class="bg-indigo-50/50 rounded-xl p-3 border border-indigo-100/50">
                                <div class="text-xs font-bold text-indigo-600 mb-1">POINT</div>
                                <p class="text-sm text-slate-600 leading-relaxed">${step.point}</p>
                            </div>
                            <div class="grid grid-cols-1 gap-3">
                                <div class="flex gap-3 bg-emerald-50/50 p-3 rounded-xl border border-emerald-100">
                                    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500 flex-shrink-0 mt-0.5"></i>
                                    <div>
                                        <div class="text-xs font-bold text-emerald-700 mb-1">Good</div>
                                        <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap">${step.good}</p>
                                    </div>
                                </div>
                                <div class="flex gap-3 bg-rose-50/50 p-3 rounded-xl border border-rose-100">
                                    <i data-lucide="x-circle" class="w-5 h-5 text-rose-400 flex-shrink-0 mt-0.5"></i>
                                    <div>
                                        <div class="text-xs font-bold text-rose-700 mb-1">Bad</div>
                                        <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap">${step.bad}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="pt-2">
                                <div class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                                    <span class="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                                    参考例文
                                </div>
                                <div class="space-y-3">
                                    ${examplesHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                flowDetailsContainer.insertAdjacentHTML('beforeend', sectionHtml);
            });

            // アイコンの初期化
            lucide.createIcons();
        });

        // コピー機能
        function copyText(btnElement, text) {
            // テキストエリアを作成してコピー (スマホ対応のため)
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                
                // ボタンの見た目を変更
                const iconCopy = btnElement.querySelector('.icon-copy');
                const iconCheck = btnElement.querySelector('.icon-check');
                const btnText = btnElement.querySelector('.btn-text');
                
                btnElement.classList.add('copied');
                iconCopy.classList.add('hidden');
                iconCheck.classList.remove('hidden');
                btnText.textContent = "コピー完了";

                // 2秒後に元に戻す
                setTimeout(() => {
                    btnElement.classList.remove('copied');
                    iconCopy.classList.remove('hidden');
                    iconCheck.classList.add('hidden');
                    btnText.textContent = "コピー";
                }, 2000);

            } catch (err) {
                console.error('Copy failed', err);
                alert("コピーに失敗しました");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
